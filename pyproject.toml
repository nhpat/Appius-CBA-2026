[project]
name = "foundation-prospector"
version = "0.1.0"
description = "Find and score private foundations for rural New York nonprofits (Appius Communications x Cornell Business Analytics)"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0", "openpyxl>=3.1", "requests>=2.31", "rapidfuzz>=3.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
